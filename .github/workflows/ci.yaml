name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Run integration tests (requires GPU)'
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 6am UTC

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7.1
        with:
            enable-cache: true
            python-version: 3.13
      - run: uv run --all-extras --dev pytest -vvv --cov=src
      - name: Report Coverage
        run: uv run --all-extras --dev coverage report -m

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7.1
        with:
            enable-cache: true
            python-version: 3.13
      - name: pre-commit
        run: uv run --all-extras --dev pre-commit run --all-files -v

  test-integration:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7.1
        with:
            enable-cache: true
            python-version: 3.13
      - name: Run integration tests
        run: uv run --all-extras --dev pytest -vvv -m integration
        env:
          GOLDENEYE_RUN_INFERENCE: "1"

